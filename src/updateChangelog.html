<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's New</title>
  <style>
    :root { color-scheme: light dark; font-family: "Segoe UI", sans-serif; }
    body { margin: 0; padding: 24px 26px 28px; background: Canvas; color: CanvasText; }
    h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
    #version { opacity: .65; font-size: 12px; margin-bottom: 18px; }
    #notes { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.5 "Segoe UI", sans-serif; }
  </style>
</head>
<body>
  <h1>What's new</h1>
  <div id="version"></div>
  <pre id="notes"></pre>
  <script>
    window.setReleaseNotes = ({ version, notes }) => {
      document.getElementById('version').textContent = version ? `Version ${version}` : '';
      document.getElementById('notes').textContent = notes || '';
    };
  </script>
</body>
</html>
