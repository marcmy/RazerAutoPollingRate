<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Updating Razer Auto Polling Rate</title>
  <style>
    :root { color-scheme: light dark; font-family: "Segoe UI", sans-serif; }
    body { margin: 0; padding: 22px 24px; background: Canvas; color: CanvasText; }
    h1 { margin: 0 0 5px; font-size: 17px; font-weight: 600; }
    #version { opacity: .68; font-size: 12px; margin-bottom: 18px; }
    #status { font-size: 13px; margin-bottom: 9px; }
    progress { width: 100%; height: 12px; }
    #detail { min-height: 18px; margin-top: 7px; font-size: 11px; opacity: .68; text-align: right; }
  </style>
</head>
<body>
  <h1>Installing update</h1>
  <div id="version"></div>
  <div id="status">Preparing download…</div>
  <progress id="progress" max="1" value="0"></progress>
  <div id="detail"></div>
  <script>
    window.setUpdateProgress = ({ version, status, detail, fraction }) => {
      document.getElementById('version').textContent = version ? `Version ${version}` : '';
      document.getElementById('status').textContent = status || '';
      document.getElementById('detail').textContent = detail || '';
      const progress = document.getElementById('progress');
      if (Number.isFinite(fraction)) {
        progress.value = Math.max(0, Math.min(1, fraction));
      } else {
        progress.removeAttribute('value');
      }
    };
  </script>
</body>
</html>
