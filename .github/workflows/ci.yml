name: CI

on:
  push:
    branches:
      - main
      - 'marc/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-windows:
    runs-on: windows-2022
    needs: test
    steps:
      - name: Check out release candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Audit dependencies
        if: github.event_name == 'workflow_dispatch'
        run: npm audit

      - name: Build Windows installer
        if: github.event_name == 'workflow_dispatch'
        run: npm run make

      - name: Standard CI marker
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          Write-Host "Tests passed. Full Windows packaging is additionally validated for dispatched release candidates."
