name: CI

on:
  push:
    branches:
      - main
      - 'marc/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-windows:
    runs-on: windows-2022
    needs: test
    steps:
      - name: Release builds moved to manual workflow
        shell: pwsh
        run: |
          Write-Host "CI verifies tests only."
          Write-Host "Windows release artifacts are built by the manual Draft Windows Release workflow."
