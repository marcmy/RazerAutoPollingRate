name: CI

on:
  push:
    branches:
      - main
      - 'marc/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-windows:
    runs-on: windows-2022
    needs: test
    steps:
      - name: Check out release candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Audit dependencies
        if: github.event_name == 'workflow_dispatch'
        run: npm audit

      - name: Build Windows installer
        if: github.event_name == 'workflow_dispatch'
        run: npm run make

      - name: Generate SHA256 hashes
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $root = (Resolve-Path 'out/make').Path

          Get-ChildItem -Path $root -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              $relativePath = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\\', '/')
              "$($hash.Hash.ToLower())  $relativePath"
            } | Set-Content -Encoding ASCII SHA256SUMS.txt

      - name: Upload Windows test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: RazerAutoPollingRate-Windows-${{ github.sha }}
          path: |
            out/make/**
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Standard CI marker
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          Write-Host "Tests passed. Full Windows packaging is additionally validated for dispatched release candidates."
