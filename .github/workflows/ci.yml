name: CI

on:
  push:
    branches:
      - main
      - 'marc/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Electron entrypoint syntax
        run: |
          node --check src/bootstrap.js
          node --check src/main.js
      - run: npm test

  build-windows:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-2022
    timeout-minutes: 30
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build Windows installer
        run: npm run make

      - name: Generate SHA256 hashes
        shell: pwsh
        run: |
          $root = (Resolve-Path 'out/make').Path

          Get-ChildItem -Path $root -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              $relativePath = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\\', '/')
              "$($hash.Hash.ToLower())  $relativePath"
            } | Set-Content -Encoding ASCII SHA256SUMS.txt

      - name: Prepare Scoop package
        shell: pwsh
        run: |
          $packageDirs = @(
            Get-ChildItem -LiteralPath 'out' -Directory |
              Where-Object { $_.Name -like '*-win32-x64' }
          )

          if ($packageDirs.Count -ne 1) {
            $found = @($packageDirs | ForEach-Object { $_.Name }) -join ', '
            throw "Expected exactly one packaged win32-x64 directory under out; found $($packageDirs.Count): $found"
          }

          $stagingRoot = Join-Path (Resolve-Path 'out').Path 'scoop-package'
          $appRoot = Join-Path $stagingRoot 'lib\net45'
          New-Item -ItemType Directory -Path $appRoot -Force | Out-Null
          Copy-Item -Path (Join-Path $packageDirs[0].FullName '*') -Destination $appRoot -Recurse -Force

          $expectedExe = Join-Path $appRoot 'razerautopollingrate.exe'
          if (-not (Test-Path -LiteralPath $expectedExe -PathType Leaf)) {
            throw "Scoop package is missing expected executable: $expectedExe"
          }

      - name: Upload Windows test build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: RazerAutoPollingRate-Windows-${{ github.sha }}
          path: |
            out/make/**
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Scoop package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: RazerAutoPollingRate-Scoop-main-${{ github.sha }}
          path: out/scoop-package/**
          if-no-files-found: error
          retention-days: 90

  sync-release-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 10
    needs: build-windows
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Windows build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RazerAutoPollingRate-Windows-${{ github.sha }}
          path: windows-artifact

      - name: Sync assets to current published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json
          $tag = "v$($package.version)"

          $releaseJson = gh release view $tag `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName,isDraft,publishedAt 2>$null

          if ($LASTEXITCODE -ne 0) {
            "No existing $tag release yet; the release workflow will publish it." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $release = $releaseJson | ConvertFrom-Json
          if ($release.isDraft) {
            "$tag is still a draft; the release workflow owns its assets." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $assets = @(
            Get-ChildItem -LiteralPath 'windows-artifact' -Recurse -File |
              Sort-Object FullName |
              ForEach-Object { $_.FullName }
          )

          if ($assets.Count -eq 0) {
            throw 'Downloaded Windows build artifact is empty'
          }

          if (@($assets | Where-Object { [IO.Path]::GetFileName($_) -eq 'SHA256SUMS.txt' }).Count -ne 1) {
            throw 'Downloaded Windows build artifact must contain exactly one SHA256SUMS.txt'
          }

          $arguments = @(
            'release',
            'upload',
            $tag,
            '--repo',
            $env:GITHUB_REPOSITORY,
            '--clobber'
          ) + $assets

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to sync main build assets to $tag"
          }

          "Updated $tag assets from main commit $env:GITHUB_SHA." >> $env:GITHUB_STEP_SUMMARY
