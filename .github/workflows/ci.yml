name: CI

on:
  push:
    branches:
      - main
      - 'marc/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Electron entrypoint syntax
        run: |
          node --check src/bootstrap.js
          node --check src/main.js
      - run: npm test

  build-windows:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-2022
    timeout-minutes: 30
    needs: test
    outputs:
      rolling_release: ${{ steps.rolling.outputs.rolling_release }}
      rolling_version: ${{ steps.rolling.outputs.rolling_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify rolling release change
        id: rolling
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $before = $env:BEFORE_SHA
          $zeroSha = '0000000000000000000000000000000000000000'

          if ([string]::IsNullOrWhiteSpace($before) -or $before -eq $zeroSha) {
            $changedFiles = @(git show --format= --name-only $env:GITHUB_SHA)
          }
          else {
            $changedFiles = @(git diff --name-only "$before..$env:GITHUB_SHA")
          }

          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to classify files changed by the main push'
          }

          $changedFiles = @($changedFiles | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $ignoredPatterns = @(
            '^\.github/',
            '^docs/',
            '^test/',
            '^(README|CHANGELOG|CONTRIBUTING|SECURITY|RELEASING)(?:\.[^/]+)?$',
            '^LICENSE(?:\.[^/]+)?$',
            '^\.git(?:ignore|attributes)$',
            '^\.editorconfig$',
            '^AGENTS\.md$'
          )

          $releaseFiles = @(
            $changedFiles | Where-Object {
              $path = $_
              -not ($ignoredPatterns | Where-Object { $path -match $_ })
            }
          )

          $rollingRelease = $releaseFiles.Count -gt 0
          "rolling_release=$($rollingRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($rollingRelease) {
            $commitIso = git show -s --format=%cI $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($commitIso)) {
              throw 'Unable to read the main commit timestamp for rolling CalVer'
            }

            $rollingMinute = ([DateTimeOffset]::Parse($commitIso)).UtcDateTime
            $tagLines = @(
              gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags" `
                --paginate `
                --jq '.[] | [.ref, .object.sha] | @tsv'
            )
            if ($LASTEXITCODE -ne 0) {
              throw 'Unable to query existing tags while resolving rolling CalVer'
            }

            $tagTargets = @{}
            foreach ($line in $tagLines) {
              if ([string]::IsNullOrWhiteSpace($line)) {
                continue
              }
              $parts = $line -split "`t", 2
              if ($parts.Count -eq 2) {
                $tagTargets[$parts[0]] = $parts[1]
              }
            }

            while ($true) {
              $rollingVersion = $rollingMinute.ToString('yyyyMMdd.HHmm')
              $tagRef = "refs/tags/$rollingVersion"
              if (-not $tagTargets.ContainsKey($tagRef) -or $tagTargets[$tagRef] -eq $env:GITHUB_SHA) {
                break
              }
              $rollingMinute = $rollingMinute.AddMinutes(1)
            }

            "rolling_version=$rollingVersion" >> $env:GITHUB_OUTPUT
            "Rolling release $rollingVersion enabled. Application-affecting files: $($releaseFiles -join ', ')" >> $env:GITHUB_STEP_SUMMARY
          }
          else {
            "rolling_version=" >> $env:GITHUB_OUTPUT
            "Rolling release skipped. This main push changed only workflows, docs, or repository metadata." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Stamp rolling build version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rolling.outputs.rolling_release == 'true'
        run: node scripts/stamp-rolling-build.js "${{ steps.rolling.outputs.rolling_version }}"

      - name: Build Windows installer
        run: npm run make

      - name: Generate SHA256 hashes
        shell: pwsh
        run: |
          $root = (Resolve-Path 'out/make').Path

          Get-ChildItem -Path $root -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              $relativePath = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\\', '/')
              "$($hash.Hash.ToLower())  $relativePath"
            } | Set-Content -Encoding ASCII SHA256SUMS.txt

      - name: Prepare Scoop package
        shell: pwsh
        run: |
          $packageDirs = @(
            Get-ChildItem -LiteralPath 'out' -Directory |
              Where-Object { $_.Name -like '*-win32-x64' }
          )

          if ($packageDirs.Count -ne 1) {
            $found = @($packageDirs | ForEach-Object { $_.Name }) -join ', '
            throw "Expected exactly one packaged win32-x64 directory under out; found $($packageDirs.Count): $found"
          }

          $stagingRoot = Join-Path (Resolve-Path 'out').Path 'scoop-package'
          $appRoot = Join-Path $stagingRoot 'lib\net45'
          New-Item -ItemType Directory -Path $appRoot -Force | Out-Null
          Copy-Item -Path (Join-Path $packageDirs[0].FullName '*') -Destination $appRoot -Recurse -Force

          $expectedExe = Join-Path $appRoot 'razerautopollingrate.exe'
          if (-not (Test-Path -LiteralPath $expectedExe -PathType Leaf)) {
            throw "Scoop package is missing expected executable: $expectedExe"
          }

      - name: Upload Windows test build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: RazerAutoPollingRate-Windows-${{ github.sha }}
          path: |
            out/make/**
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Scoop package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rolling.outputs.rolling_release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: RazerAutoPollingRate-Scoop-main-${{ steps.rolling.outputs.rolling_version }}-${{ github.sha }}
          path: out/scoop-package/**
          if-no-files-found: error
          retention-days: 90

  publish-rolling-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-windows.outputs.rolling_release == 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    needs: build-windows
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RazerAutoPollingRate-Windows-${{ github.sha }}
          path: windows-artifact

      - name: Create rolling release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLING_VERSION: ${{ needs.build-windows.outputs.rolling_version }}
          ROLLING_TAG: ${{ needs.build-windows.outputs.rolling_version }}
        run: |
          $existingJson = gh release view $env:ROLLING_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName,targetCommitish,isDraft 2>$null

          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if ($existing.targetCommitish -ne $env:GITHUB_SHA) {
              throw "Rolling tag $env:ROLLING_TAG already belongs to $($existing.targetCommitish), not $env:GITHUB_SHA"
            }
          }
          else {
            $notes = @(
              "Rolling build $env:ROLLING_VERSION from main.",
              '',
              "Commit: $env:GITHUB_SHA"
            )
            [IO.File]::WriteAllLines('ROLLING_RELEASE_NOTES.md', $notes, [Text.UTF8Encoding]::new($false))

            gh release create $env:ROLLING_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "Razer Auto Polling Rate $env:ROLLING_VERSION" `
              --notes-file ROLLING_RELEASE_NOTES.md `
              --draft
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create rolling release $env:ROLLING_TAG"
            }
          }

          $setupFiles = @(Get-ChildItem -LiteralPath 'windows-artifact' -Recurse -File | Where-Object { $_.Name -like '*Setup.exe' })
          $nupkgFiles = @(Get-ChildItem -LiteralPath 'windows-artifact' -Recurse -File | Where-Object { $_.Name -like '*-full.nupkg' })
          $releasesFiles = @(Get-ChildItem -LiteralPath 'windows-artifact' -Recurse -File | Where-Object { $_.Name -eq 'RELEASES' })

          if ($setupFiles.Count -ne 1 -or $nupkgFiles.Count -ne 1 -or $releasesFiles.Count -ne 1) {
            throw "Expected exactly one Setup.exe, full.nupkg, and RELEASES file in the Windows artifact"
          }

          $releaseRoot = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Path $releaseRoot -Force | Out-Null
          $setupName = "RazerAutoPollingRate-$env:ROLLING_VERSION.Setup.exe"
          Copy-Item -LiteralPath $setupFiles[0].FullName -Destination (Join-Path $releaseRoot $setupName)
          Copy-Item -LiteralPath $nupkgFiles[0].FullName -Destination (Join-Path $releaseRoot $nupkgFiles[0].Name)
          Copy-Item -LiteralPath $releasesFiles[0].FullName -Destination (Join-Path $releaseRoot 'RELEASES')

          Get-ChildItem -LiteralPath $releaseRoot -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              "$($hash.Hash.ToLower())  $($_.Name)"
            } | Set-Content -Encoding ASCII (Join-Path $releaseRoot 'SHA256SUMS.txt')

          $assets = @(
            Get-ChildItem -LiteralPath $releaseRoot -File |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )

          $arguments = @(
            'release',
            'upload',
            $env:ROLLING_TAG,
            '--repo',
            $env:GITHUB_REPOSITORY,
            '--clobber'
          ) + $assets

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to upload rolling release assets to $env:ROLLING_TAG"
          }

          gh release edit $env:ROLLING_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --draft=false `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to publish rolling release $env:ROLLING_TAG as Latest"
          }

          "Published $env:ROLLING_TAG from main commit $env:GITHUB_SHA and marked it Latest." >> $env:GITHUB_STEP_SUMMARY
