name: CI

on:
  push:
    branches:
      - main
      - 'marc/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-runtime-library-launchers:
    if: github.event_name == 'push' && github.ref == 'refs/heads/marc/fix-runtime-library-launchers' && github.event.head_commit.message != 'Patch runtime provider launcher filtering'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Apply source and regression-test patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/lib/gameLibraries.js')
          text = source.read_text(encoding='utf-8')
          needle = """function gameForExecutable(executablePath, libraries = []) {\n  const library = findContainingLibrary(executablePath, libraries);\n  if (!library) {\n    return null;\n  }\n\n"""
          replacement = needle + """  if (!library.custom) {\n    const baseName = winPath.basename(executablePath, '.exe');\n    if (/launcher/i.test(baseName) || HELPER_EXECUTABLE_PATTERN.test(baseName)) {\n      return null;\n    }\n  }\n\n"""
          if needle not in text:
              raise SystemExit('gameForExecutable patch point not found')
          source.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          test_file = Path('test/runtimeGameMatching.test.js')
          test_file.write_text(r'''const test = require('node:test');
          const assert = require('node:assert/strict');

          const { gameForExecutable } = require('../src/lib/gameLibraries');

          test('known provider runtime matching ignores launchers and helpers', () => {
            const libraries = [{
              name: 'Steam',
              provider: 'steam',
              root: 'D:\\SteamLibrary\\steamapps\\common',
              custom: false,
            }];

            assert.equal(
              gameForExecutable('D:\\SteamLibrary\\steamapps\\common\\Apex Legends\\ApexLauncher.exe', libraries),
              null,
            );
            assert.equal(
              gameForExecutable('D:\\SteamLibrary\\steamapps\\common\\Apex Legends\\crashmsg.exe', libraries),
              null,
            );

            const game = gameForExecutable(
              'D:\\SteamLibrary\\steamapps\\common\\Apex Legends\\r5apex_dx12.exe',
              libraries,
            );
            assert.equal(game.name, 'Apex Legends');
            assert.equal(game.processName, 'r5apex_dx12.exe');
          });

          test('custom runtime matching remains permissive for launcher-named executables', () => {
            const libraries = [{
              name: 'Custom',
              provider: 'custom',
              root: 'C:\\Games',
              custom: true,
            }];

            const game = gameForExecutable('C:\\Games\\Community Client\\MyLauncher.exe', libraries);
            assert.equal(game.name, 'Community Client');
            assert.equal(game.processName, 'MyLauncher.exe');
          });
          ''', encoding='utf-8')

          runner = Path('test/run-tests.js')
          runner_text = runner.read_text(encoding='utf-8')
          require_line = "require('./runtimeGameMatching.test');\n"
          if require_line not in runner_text:
              runner.write_text(runner_text + require_line, encoding='utf-8')
          PY

          npm ci
          npm test

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/gameLibraries.js test/runtimeGameMatching.test.js test/run-tests.js
          git commit -m "Patch runtime provider launcher filtering"
          git push

  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-windows:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: windows-2022
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build Windows installer
        run: npm run make

      - name: Generate SHA256 hashes
        shell: pwsh
        run: |
          $root = (Resolve-Path 'out/make').Path

          Get-ChildItem -Path $root -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              $relativePath = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\\', '/')
              "$($hash.Hash.ToLower())  $relativePath"
            } | Set-Content -Encoding ASCII SHA256SUMS.txt

      - name: Upload Windows test build
        uses: actions/upload-artifact@v7
        with:
          name: RazerAutoPollingRate-Windows-${{ github.sha }}
          path: |
            out/make/**
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
