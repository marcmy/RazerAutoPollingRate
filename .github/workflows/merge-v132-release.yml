name: Merge v1.3.2 Release PR

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.head_ref == 'marc/merge-v1.3.2-release'
    runs-on: ubuntu-latest
    steps:
      - name: Merge release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge 33 --repo "$GITHUB_REPOSITORY" --squash --delete-branch --subject "chore: release v1.3.2"
