name: Dispatch v1.3.2 Release

on:
  pull_request:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.head_ref == 'marc/dispatch-v1.3.2'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch patch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f bump=patch
