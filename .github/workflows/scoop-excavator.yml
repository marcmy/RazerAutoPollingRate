name: Scoop Bucket Excavator

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read

jobs:
  trigger-excavator:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: scoop-bucket
    steps:
      - name: Check for rolling Scoop artifact
        id: rolling-artifact
        if: github.event_name == 'workflow_run'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $escapedSha = [regex]::Escape($env:SOURCE_HEAD_SHA)
          $expectedPattern = "^RazerAutoPollingRate-Scoop-main-\d{8}\.\d{4}-$escapedSha$"
          $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID/artifacts?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to query source CI artifacts'
          }

          $artifact = @(
            $response.artifacts | Where-Object {
              $_.name -match $expectedPattern -and -not $_.expired
            }
          )

          if ($artifact.Count -gt 1) {
            throw "Found multiple live rolling Scoop artifacts for $env:SOURCE_HEAD_SHA"
          }

          $shouldDispatch = $artifact.Count -eq 1
          "should_dispatch=$($shouldDispatch.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($shouldDispatch) {
            "Found $($artifact[0].name); dispatching the Scoop Excavator." >> $env:GITHUB_STEP_SUMMARY
          }
          else {
            "No rolling Scoop artifact was produced for this CI run; skipping Excavator dispatch." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Trigger scoop bucket Excavator
        if: github.event_name == 'workflow_dispatch' || steps.rolling-artifact.outputs.should_dispatch == 'true'
        shell: pwsh
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PAT: ${{ secrets.PAT }}
        run: |
          $credentials = @(
            @{ Name = 'SCOOP_BUCKET_TOKEN'; Value = $env:SCOOP_BUCKET_TOKEN }
            @{ Name = 'GH_PAT'; Value = $env:GH_PAT }
            @{ Name = 'PAT'; Value = $env:PAT }
          )

          $configured = @(
            $credentials | Where-Object {
              -not [string]::IsNullOrWhiteSpace($_.Value)
            }
          )

          if ($configured.Count -eq 0) {
            Write-Warning "No cross-repo token is configured. Skipping the immediate Scoop trigger; the scheduled Excavator in marcmy/scoop-bucket will pick up the release automatically."
            exit 0
          }

          foreach ($credential in $configured) {
            Write-Host "Trying cross-repo credential $($credential.Name)..."
            $env:GH_TOKEN = $credential.Value

            gh workflow run excavator.yml --repo marcmy/scoop-bucket --ref master
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Triggered Scoop Excavator using $($credential.Name)."
              exit 0
            }

            Write-Warning "$($credential.Name) failed to trigger the Scoop Excavator. Trying the next configured credential."
          }

          throw "Immediate Scoop trigger failed with all configured cross-repo credentials."
