name: Publish Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      commit:
        description: Commit SHA to release
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Validate release metadata
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
          RELEASE_COMMIT_INPUT: ${{ inputs.commit }}
        run: |
          if ($env:RELEASE_TAG_INPUT -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag format"
          }
          if ($env:RELEASE_COMMIT_INPUT -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid release commit format"
          }

          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          $actualCommit = git rev-parse HEAD
          $expectedCommit = $env:RELEASE_COMMIT_INPUT.ToLowerInvariant()

          if ($env:RELEASE_TAG_INPUT -ne $expectedTag) {
            throw "Release tag $env:RELEASE_TAG_INPUT does not match package version $version"
          }

          if ($actualCommit -ne $expectedCommit) {
            throw "Checked out commit $actualCommit, expected $expectedCommit"
          }

          git fetch origin main
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch origin/main"
          }

          git merge-base --is-ancestor $actualCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release commit $actualCommit is not reachable from main"
          }

          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$expectedTag" >> $env:GITHUB_ENV
          "RELEASE_COMMIT=$actualCommit" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run make

      - name: Generate SHA256 hashes
        shell: pwsh
        run: |
          $root = (Resolve-Path 'out/make').Path

          Get-ChildItem -Path $root -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              $relativePath = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
              "$($hash.Hash.ToLower())  $relativePath"
            } | Set-Content -Encoding ASCII SHA256SUMS.txt

      - name: Generate release notes from changelog
        shell: pwsh
        run: |
          $lines = @(Get-Content -LiteralPath 'CHANGELOG.md')
          $heading = "## $env:RELEASE_TAG"
          $start = [Array]::IndexOf($lines, $heading)

          if ($start -lt 0) {
            throw "CHANGELOG.md does not contain an exact '$heading' section"
          }

          $end = $lines.Count
          for ($index = $start + 1; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match '^##\s+') {
              $end = $index
              break
            }
          }

          $section = if ($end -gt ($start + 1)) {
            @($lines[($start + 1)..($end - 1)])
          }
          else {
            @()
          }

          while ($section.Count -gt 0 -and [string]::IsNullOrWhiteSpace($section[0])) {
            $section = @($section | Select-Object -Skip 1)
          }
          while ($section.Count -gt 0 -and [string]::IsNullOrWhiteSpace($section[-1])) {
            $section = @($section | Select-Object -SkipLast 1)
          }

          if ($section.Count -eq 0) {
            throw "The $heading changelog section is empty"
          }

          $changelogUrl = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:RELEASE_COMMIT/CHANGELOG.md"
          $notes = @($section) + @('', '---', '', "[Complete changelog]($changelogUrl)")
          [IO.File]::WriteAllLines('RELEASE_NOTES.md', $notes, [Text.UTF8Encoding]::new($false))

      - name: Create or update draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName *> $null

          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:RELEASE_COMMIT `
              --title "Razer Auto Polling Rate $env:RELEASE_VERSION" `
              --notes-file RELEASE_NOTES.md `
              --draft
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create draft release"
            }
          }
          else {
            gh release edit $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --title "Razer Auto Polling Rate $env:RELEASE_VERSION" `
              --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to update draft release notes"
            }
          }

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -Path 'out/make' -Recurse -File |
              Sort-Object FullName |
              ForEach-Object { $_.FullName }
          )
          $assets += (Resolve-Path 'SHA256SUMS.txt').Path

          $arguments = @(
            'release',
            'upload',
            $env:RELEASE_TAG,
            '--repo',
            $env:GITHUB_REPOSITORY,
            '--clobber'
          ) + $assets

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to upload release assets"
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --draft=false `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to publish release"
          }

          $releaseUrl = gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json url `
            --jq .url

          "RELEASE_URL=$releaseUrl" >> $env:GITHUB_ENV

      - name: Trigger Scoop bucket update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scoop-excavator.yml `
            --repo $env:GITHUB_REPOSITORY `
            --ref main
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to dispatch the Scoop excavator trigger"
          }

          "## Released [$env:RELEASE_TAG]($env:RELEASE_URL)" >> $env:GITHUB_STEP_SUMMARY
          "Windows artifacts and SHA256SUMS.txt were uploaded, and the Scoop trigger workflow was dispatched." >> $env:GITHUB_STEP_SUMMARY
