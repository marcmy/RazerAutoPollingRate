name: Fix v1.3.4 provider launcher entries

on:
  push:
    branches:
      - v1.3.4-game-library-ui
    paths:
      - .github/workflows/fix-v134-provider-launchers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1.3.4-game-library-ui

      - name: Patch provider game filtering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          game_path = Path('src/lib/gameLibraries.js')
          game = game_path.read_text(encoding='utf-8')

          old = "const NON_GAME_FOLDER_PATTERN = /^(?:launcher|launchers|riot client|social club|redistributables|support|tools?)$/i;\n"
          new = old + "const PROVIDER_UTILITY_GAME_NAME_PATTERN = /\\b(?:launcher|client)\\b/i;\n"
          if old not in game:
              raise SystemExit('Missing NON_GAME_FOLDER_PATTERN')
          game = game.replace(old, new, 1)

          old = """      const gameRoot = winPath.join(library.root, child.name);
      const gameName = steamNames.get(normalizeWindowsPath(gameRoot)) || child.name;
      const executablePath = findLikelyExecutable(gameRoot, gameName, { fsImpl });
"""
          new = """      const gameRoot = winPath.join(library.root, child.name);
      const gameName = steamNames.get(normalizeWindowsPath(gameRoot)) || child.name;

      // Known provider libraries can contain standalone launchers/clients that are
      // installed independently from any playable game. Do not present those as
      // games. Custom folders stay permissive because users may intentionally keep
      // unusual community clients or alternate engines there.
      if (!library.custom && PROVIDER_UTILITY_GAME_NAME_PATTERN.test(gameName)) {
        return;
      }

      const executablePath = findLikelyExecutable(gameRoot, gameName, { fsImpl });
"""
          if old not in game:
              raise SystemExit('Missing scan child block')
          game = game.replace(old, new, 1)

          old = "    if (games.length === gamesBeforeLibrary) {\n"
          new = "    if (library.custom && games.length === gamesBeforeLibrary) {\n"
          if old not in game:
              raise SystemExit('Missing custom-root fallback condition')
          game = game.replace(old, new, 1)
          game_path.write_text(game, encoding='utf-8')

          test_path = Path('test/gameLibraries.test.js')
          tests = test_path.read_text(encoding='utf-8')
          old = "  parseSteamLibraryFolders,\n} = require('../src/lib/gameLibraries');"
          new = "  parseSteamLibraryFolders,\n  scanLibraryGames,\n} = require('../src/lib/gameLibraries');"
          if old not in tests:
              raise SystemExit('Missing gameLibraries test import block')
          tests = tests.replace(old, new, 1)

          tests += r'''

test('known provider launcher-only entries are not shown as games', () => {
  const root = 'D:\\XboxGames';
  const fsImpl = {
    existsSync(candidate) {
      return candidate === root;
    },
    statSync(candidate) {
      if (candidate === root) return { isDirectory: () => true };
      throw new Error(`unexpected stat ${candidate}`);
    },
    readdirSync(directory) {
      if (directory === root) {
        return [
          { name: 'Minecraft Launcher', isDirectory: () => true, isFile: () => false },
        ];
      }
      throw new Error(`launcher directory should not be scanned: ${directory}`);
    },
  };

  assert.deepEqual(
    scanLibraryGames([{ name: 'Xbox', provider: 'xbox', root, custom: false }], { fsImpl }),
    [],
  );
});

test('custom folders remain permissive for unusual launcher or client names', () => {
  const root = 'C:\\Games';
  const gameRoot = `${root}\\Custom Client`;
  const executable = `${gameRoot}\\clientgame.exe`;
  const fsImpl = {
    existsSync(candidate) {
      return candidate === root;
    },
    statSync(candidate) {
      if (candidate === root) return { isDirectory: () => true };
      if (candidate === executable) return { size: 50_000_000 };
      throw new Error(`unexpected stat ${candidate}`);
    },
    readdirSync(directory) {
      if (directory === root) {
        return [
          { name: 'Custom Client', isDirectory: () => true, isFile: () => false },
        ];
      }
      if (directory === gameRoot) {
        return [
          { name: 'clientgame.exe', isDirectory: () => false, isFile: () => true },
        ];
      }
      return [];
    },
  };

  const games = scanLibraryGames([{ name: 'Custom', provider: 'custom', root, custom: true }], { fsImpl });
  assert.equal(games.length, 1);
  assert.equal(games[0].name, 'Custom Client');
  assert.equal(games[0].executablePath, executable);
});
'''
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check src/lib/gameLibraries.js
          node --test test/gameLibraries.test.js

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/gameLibraries.js test/gameLibraries.test.js
          git commit -m "Ignore provider launcher-only entries"
          git push origin HEAD:v1.3.4-game-library-ui
