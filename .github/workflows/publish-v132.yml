name: Dispatch v1.3.2 Publisher

on:
  pull_request:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.head_ref == 'marc/dispatch-v1.3.2'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Windows publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.3.2 -f commit=5f37b114ec8d8e983a082e87bf4913820eee71f2
