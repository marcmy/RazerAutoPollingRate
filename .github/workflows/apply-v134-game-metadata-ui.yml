name: Apply v1.3.4 game metadata UI patch

on:
  push:
    branches:
      - v1.3.4-game-library-ui
    paths:
      - tools/patch-v134-game-metadata-ui.js
      - .github/workflows/apply-v134-game-metadata-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1.3.4-game-library-ui

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Apply patch
        run: node tools/patch-v134-game-metadata-ui.js

      - name: Validate
        run: |
          node --check src/main.js
          node --check src/settings.html || true
          node --check src/lib/appConfig.js
          node --check src/lib/gameMetadata.js
          npm ci
          npm test

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/settings.html src/lib/appConfig.js src/lib/gameMetadata.js test/appConfig.test.js test/gameMetadata.test.js
          git commit -m "Add compact game cards and per-game metadata"
          git push origin HEAD:v1.3.4-game-library-ui
