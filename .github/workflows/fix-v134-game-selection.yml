name: Fix v1.3.4 game selection

on:
  push:
    branches:
      - v1.3.4-game-library-ui
    paths:
      - .github/workflows/fix-v134-game-selection.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1.3.4-game-library-ui

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply targeted discovery fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              return text.replace(old, new, 1)

          game_path = Path('src/lib/gameLibraries.js')
          game = game_path.read_text(encoding='utf-8')

          old = """const HELPER_DIRECTORY_PATTERN = /^(?:_commonredist|redist|redistributables|support|installer|installers|uninstall|uninstaller|crash(?:pad|reporter)?|easyanticheat|battleye)$/i;
          const HELPER_EXECUTABLE_PATTERN = /(?:unins|uninstall|setup|installer|crash|report|easyanticheat|eac|battleye|beservice|vc_redist|vcredist|dxsetup|dotnet|ue4prereq|ue5prereq|cefprocess|helper|updater|update)\\b/i;
          const NON_GAME_FOLDER_PATTERN = /^(?:launcher|launchers|riot client|social club|redistributables|support|tools?)$/i;
          """
          new = """const HELPER_DIRECTORY_PATTERN = /^(?:_commonredist|redist|redistributables|support|installer|installers|uninstall|uninstaller|crash(?:msg|pad|reporter|handler|sender)?|easyanticheat|battleye)$/i;
          const HELPER_EXECUTABLE_PATTERN = /(?:unins|uninstall|setup|installer|crash(?:msg|pad|reporter|handler|sender)?|report(?:er)?|easyanticheat|eac|battleye|beservice|vc_redist|vcredist|dxsetup|dotnet|ue4prereq|ue5prereq|cefprocess|helper|updater|update)\\b/i;
          const NON_GAME_FOLDER_PATTERN = /^(?:launcher|launchers|riot client|social club|redistributables|support|tools?)$/i;
          const GAME_IDENTITY_NOISE_TOKENS = new Set([
            'x64', 'x86', 'win64', 'win32', 'shipping', 'release', 'launcher',
            'steam', 'gog', 'epic', 'dx11', 'dx12', 'd3d11', 'd3d12', 'vulkan',
          ]);
          const GAME_NAME_STOP_TOKENS = new Set([
            'game', 'games', 'edition', 'deluxe', 'ultimate', 'complete', 'collection',
            'remastered', 'enhanced', 'launcher', 'windows', 'microsoft',
          ]);
          const GENERIC_GAME_SUBDIRECTORY_PATTERN = /^(?:win64|win32|x64|x86|binaries|bin|rerelease|release|remaster(?:ed)?|enhanced)$/i;
          """
          game = replace_once(game, old, new, 'helper constants')

          old = """function normalizeGameName(value) {
            return String(value || '')
              .toLowerCase()
              .replace(/\\b(?:x64|win64|shipping|release|launcher)\\b/g, '')
              .replace(/[^a-z0-9]+/g, '');
          }
          """
          new = """function splitNameTokens(value) {
            return String(value || '')
              .toLowerCase()
              .split(/[^a-z0-9]+/)
              .filter(Boolean);
          }

          function normalizeGameName(value) {
            return splitNameTokens(value)
              .filter((token) => !GAME_IDENTITY_NOISE_TOKENS.has(token))
              .join('');
          }

          function getMeaningfulGameNameTokens(value) {
            return splitNameTokens(value)
              .filter((token) => token.length >= 4 && !GAME_NAME_STOP_TOKENS.has(token));
          }
          """
          game = replace_once(game, old, new, 'game-name normalization')

          old = """  if (normalizedGame && normalizedBase) {
            if (normalizedBase === normalizedGame) {
              score += 160;
            } else if (normalizedBase.includes(normalizedGame) || normalizedGame.includes(normalizedBase)) {
              score += 80;
            }
          }

          if (/\\\\binaries\\\\win64\\\\/i.test(executablePath.replace(/\\//g, '\\\\'))) {
            score += 24;
          }

          if (/launcher/i.test(base)) {
            score -= 18;
          }

          if (HELPER_EXECUTABLE_PATTERN.test(base)) {
            score -= 250;
          }
          """
          new = """  if (normalizedGame && normalizedBase) {
            if (normalizedBase === normalizedGame) {
              score += 160;
            } else if (normalizedBase.includes(normalizedGame) || normalizedGame.includes(normalizedBase)) {
              score += 80;
            }
          }

          const tokenMatch = getMeaningfulGameNameTokens(gameName)
            .filter((token) => normalizedBase.includes(token))
            .sort((left, right) => right.length - left.length)[0];
          if (tokenMatch) {
            score += 70 + Math.min(30, tokenMatch.length * 3);
          }

          const normalizedExecutablePath = executablePath.replace(/\\//g, '\\\\');
          if (/\\\\binaries\\\\win64\\\\/i.test(normalizedExecutablePath)) {
            score += 24;
          }

          if (/\\\\(?:rerelease|remaster(?:ed)?|enhanced)\\\\/i.test(normalizedExecutablePath)) {
            score += 120;
          }

          if (/launcher/i.test(base)) {
            score -= 18;
          }

          if (HELPER_EXECUTABLE_PATTERN.test(base)) {
            score -= 400;
          }
          """
          game = replace_once(game, old, new, 'executable scoring')

          old = """      if (item.isFile() && /\\.exe$/i.test(item.name)) {
                candidates.push({
                  path: fullPath,
                  score: executableScore(fullPath, gameName, gameRoot, fsImpl),
                });
              }
          """
          new = """      if (item.isFile() && /\\.exe$/i.test(item.name)) {
                const baseName = winPath.basename(item.name, '.exe');
                if (HELPER_EXECUTABLE_PATTERN.test(baseName)) {
                  continue;
                }

                candidates.push({
                  path: fullPath,
                  score: executableScore(fullPath, gameName, gameRoot, fsImpl),
                });
              }
          """
          game = replace_once(game, old, new, 'helper executable filtering')

          marker = "\nfunction gameForExecutable(executablePath, libraries = []) {\n"
          helper = """
          function getFriendlyGameNameFromExecutable(executablePath) {
            const target = displayWindowsPath(executablePath);
            if (!target) {
              return 'Game';
            }

            if (/^[a-z]:\\\\/i.test(target)) {
              let directory = winPath.dirname(target);
              while (GENERIC_GAME_SUBDIRECTORY_PATTERN.test(winPath.basename(directory))) {
                directory = winPath.dirname(directory);
              }

              const folderName = winPath.basename(directory);
              if (folderName) {
                return folderName;
              }
            }

            return winPath.basename(target, winPath.extname(target)) || target || 'Game';
          }
          """
          if marker not in game:
              raise SystemExit('Missing gameForExecutable marker')
          game = game.replace(marker, '\n' + helper.strip() + '\n' + marker, 1)

          game = replace_once(
              game,
              """  findLikelyExecutable,\n  gameForExecutable,\n""",
              """  findLikelyExecutable,\n  gameForExecutable,\n  getFriendlyGameNameFromExecutable,\n""",
              'friendly-name export',
          )
          game_path.write_text(game, encoding='utf-8')

          main_path = Path('src/main.js')
          main = main_path.read_text(encoding='utf-8')
          main = replace_once(
              main,
              """  discoverGameLibraries,\n  gameForExecutable,\n  normalizeWindowsPath,\n  scanLibraryGames,\n""",
              """  discoverGameLibraries,\n  gameForExecutable,\n  getFriendlyGameNameFromExecutable,\n  isPathInsideRoot,\n  normalizeWindowsPath,\n  scanLibraryGames,\n""",
              'game library imports',
          )

          pattern = re.compile(r"function getFriendlyRuleName\(rule\) \{.*?\n\}\n\nfunction ruleMatchesGame", re.S)
          replacement = """function getFriendlyRuleName(rule) {
            return getFriendlyGameNameFromExecutable(rule.target);
          }

          function ruleMatchesGame"""
          main, count = pattern.subn(replacement, main, count=1)
          if count != 1:
              raise SystemExit('Could not replace getFriendlyRuleName')

          old = """  if (/^[a-z]:\\\\/i.test(target) && game.executablePath) {
            return normalizeWindowsPath(target) === normalizeWindowsPath(game.executablePath);
          }
          """
          new = """  if (/^[a-z]:\\\\/i.test(target) && game.executablePath) {
            if (normalizeWindowsPath(target) === normalizeWindowsPath(game.executablePath)) {
              return true;
            }

            return Boolean(game.gameRoot) && isPathInsideRoot(target, game.gameRoot);
          }
          """
          main = replace_once(main, old, new, 'rule-to-game folder matching')

          old = """    cards.push({
                ...game,
                kind: 'auto',
                customized: Boolean(override),
                pollingRate: override ? override.pollingRate : null,
                detectionMode: override ? override.detectionMode : 'default',
                overrideTarget: override ? override.target : null,
                iconDataUrl: await getExecutableIconDataUrl(game.executablePath),
              });
          """
          new = """    const overrideExecutablePath = override && /^[a-z]:\\\\/i.test(override.target)
                ? override.target
                : null;
              const cardExecutablePath = overrideExecutablePath || game.executablePath;
              const cardProcessName = override
                ? path.win32.basename(override.target)
                : game.processName;

              cards.push({
                ...game,
                executablePath: cardExecutablePath,
                processName: cardProcessName,
                kind: 'auto',
                customized: Boolean(override),
                pollingRate: override ? override.pollingRate : null,
                detectionMode: override ? override.detectionMode : 'default',
                overrideTarget: override ? override.target : null,
                iconDataUrl: await getExecutableIconDataUrl(cardExecutablePath),
              });
          """
          main = replace_once(main, old, new, 'auto card explicit executable display')
          main_path.write_text(main, encoding='utf-8')

          test_path = Path('test/gameLibraries.test.js')
          tests = test_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              """  findContainingLibrary,\n  gameForExecutable,\n  isPathInsideRoot,\n""",
              """  findContainingLibrary,\n  findLikelyExecutable,\n  gameForExecutable,\n  getFriendlyGameNameFromExecutable,\n  isPathInsideRoot,\n""",
              'test imports',
          )
          tests += r'''

          test('Apex discovery ignores crashmsg.exe and prefers the real game executable', () => {
            const root = 'D:\\SteamLibrary\\steamapps\\common\\Apex Legends';
            const fsImpl = {
              readdirSync(directory) {
                if (directory === root) {
                  return [
                    { name: 'crashmsg.exe', isDirectory: () => false, isFile: () => true },
                    { name: 'r5apex_dx12.exe', isDirectory: () => false, isFile: () => true },
                  ];
                }
                return [];
              },
              statSync(file) {
                return { size: /r5apex/i.test(file) ? 80_000_000 : 8_000_000 };
              },
            };

            assert.equal(
              findLikelyExecutable(root, 'Apex Legends', { fsImpl }),
              `${root}\\r5apex_dx12.exe`,
            );
          });

          test('Quake discovery prefers the rerelease binary over the legacy root executable', () => {
            const root = 'D:\\SteamLibrary\\steamapps\\common\\Quake';
            const rerelease = `${root}\\rerelease`;
            const fsImpl = {
              readdirSync(directory) {
                if (directory === root) {
                  return [
                    { name: 'quake.exe', isDirectory: () => false, isFile: () => true },
                    { name: 'rerelease', isDirectory: () => true, isFile: () => false },
                  ];
                }
                if (directory === rerelease) {
                  return [
                    { name: 'quake_x64_steam.exe', isDirectory: () => false, isFile: () => true },
                  ];
                }
                return [];
              },
              statSync() {
                return { size: 20_000_000 };
              },
            };

            assert.equal(
              findLikelyExecutable(root, 'Quake', { fsImpl }),
              `${rerelease}\\quake_x64_steam.exe`,
            );
          });

          test('nested rerelease executable paths keep the parent game name', () => {
            assert.equal(
              getFriendlyGameNameFromExecutable('D:\\SteamLibrary\\steamapps\\common\\Quake\\rerelease\\quake_x64_steam.exe'),
              'Quake',
            );
          });
          '''.replace('\n          ', '\n').lstrip('\n')
          test_path.write_text(tests, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          changelog = replace_once(
              changelog,
              '## Unreleased\n',
              """## Unreleased

          ### Fixed

          - Improved automatic executable selection so crash/reporting helpers such as `crashmsg.exe` are ignored in favor of real game binaries.
          - Prefer rerelease/remastered/enhanced binaries over legacy root executables when both are present in one game install.
          - Explicit executables inside an auto-detected game folder now merge into that game card and retain the parent game name instead of a build subfolder such as `rerelease`.
""".replace('\n          ', '\n'),
              'unreleased fixes',
          )
          changelog_path.write_text(changelog, encoding='utf-8')

      - name: Validate JavaScript and tests
        run: |
          node --check src/main.js
          node --check src/lib/gameLibraries.js
          npm test

      - name: Commit fixes and remove patch workflow
        shell: bash
        run: |
          git config user.name "marcmy"
          git config user.email "21000174+marcmy@users.noreply.github.com"
          git rm .github/workflows/fix-v134-game-selection.yml
          git add src/lib/gameLibraries.js src/main.js test/gameLibraries.test.js CHANGELOG.md
          git commit -m "Fix v1.3.4 game executable discovery"
          git push origin HEAD:v1.3.4-game-library-ui
