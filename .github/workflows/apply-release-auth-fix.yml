name: Apply Release Git Auth Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'marc/fix-release-git-auth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: marc/fix-release-git-auth
          fetch-depth: 0

      - name: Split Git and API credentials
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $path = '.github/workflows/release.yml'
          $content = [IO.File]::ReadAllText($path)
          $updated = $content -replace '(?m)^          persist-credentials: false\r?\n', ''
          $updated = $updated -replace '(?m)^          \$env:GH_TOKEN = \$env:RELEASE_AUTOMATION_TOKEN\r?\n          gh auth setup-git\r?\n', ''

          if ($updated -eq $content) {
            throw 'Expected release credential blocks were not changed.'
          }
          if ($updated.Contains('persist-credentials: false') -or $updated.Contains('gh auth setup-git')) {
            throw 'Release credential cleanup was incomplete.'
          }

          [IO.File]::WriteAllText($path, $updated, [Text.UTF8Encoding]::new($false))

          git rm .github/workflows/apply-release-auth-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release.yml
          git commit -m 'fix: split release Git and API credentials'
          git push origin HEAD:marc/fix-release-git-auth
