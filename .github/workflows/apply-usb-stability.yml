name: Validate polling changes
on:
  push:
    branches:
      - usb-stability-run
    paths:
      - validation-trigger.txt
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: usb-stability-run
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-stability.js
      - run: npm ci
      - run: npm test
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "fix: polling stability"
          file_pattern: src/main.js
