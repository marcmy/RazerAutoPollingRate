name: Apply polling stability refactor
on: pull_request
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'usb-stability-run'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: usb-stability-run
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: node scripts/patch-main-usb-1.js
      - name: Commit validated changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: improve polling stability"
          git push origin HEAD:usb-stability-run
