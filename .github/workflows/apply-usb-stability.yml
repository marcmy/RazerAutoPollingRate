name: Apply polling stability refactor
on: pull_request
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'usb-access-stability'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: usb-access-stability
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: node scripts/patch-main-usb-1.js
