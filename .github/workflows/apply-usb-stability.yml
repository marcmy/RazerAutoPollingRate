name: Validate polling changes
on: pull_request
jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: usb-stability-run
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-stability.js
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: validated-main
          path: src/main.js
