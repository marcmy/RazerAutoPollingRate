name: Reconstruct v1.3.4 payload

on:
  push:
    branches:
      - v1.3.4-game-library-ui
    paths:
      - '.v134-build/**'
      - '.github/workflows/reconstruct-v134.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconstruct and validate sources
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import glob
          import gzip
          import pathlib

          def reconstruct(pattern, output):
              encoded = ''.join(
                  pathlib.Path(filename).read_text(encoding='utf-8').strip()
                  for filename in sorted(glob.glob(pattern))
              )
              pathlib.Path(output).write_bytes(gzip.decompress(base64.b64decode(encoded)))

          reconstruct('.v134-build/gz/main/*.b64', 'src/main.js')
          reconstruct('.v134-build/gz/settings/*.b64', 'src/settings.html')
          PY

          test "$(git hash-object src/main.js)" = "870630462defdb1259f206eb61f0827b1f51049b"
          test "$(git hash-object src/settings.html)" = "5635b6cf600d52321f84f75d58cbeb089291bde1"
          node --check src/main.js

          python - <<'PY'
          from pathlib import Path
          source = Path('src/settings.html').read_text(encoding='utf-8')
          script = source.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('.settings-script-check.js').write_text(script, encoding='utf-8')
          PY
          node --check .settings-script-check.js
          rm .settings-script-check.js

      - name: Commit reconstructed sources and remove staging
        shell: bash
        run: |
          rm -rf .v134-build
          rm .github/workflows/reconstruct-v134.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement v1.3.4 game discovery and settings UI"
          git push origin HEAD:v1.3.4-game-library-ui
