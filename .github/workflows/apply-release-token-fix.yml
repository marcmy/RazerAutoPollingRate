name: Apply release automation token fix
on:
  push:
    branches:
      - marc/fix-release-automation-token
    paths:
      - .github/workflows/apply-release-token-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: marc/fix-release-automation-token
      - name: Patch release workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/release.yml')
          text = path.read_text(encoding='utf-8')

          checkout_old = """      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
"""
          checkout_new = """      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure release automation credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'No release automation token configured. Add RELEASE_TOKEN, SCOOP_BUCKET_TOKEN, GH_PAT, or PAT.'
          }

          gh auth setup-git
"""
          if checkout_old not in text:
              raise SystemExit('checkout block not found')
          text = text.replace(checkout_old, checkout_new, 1)

          job_old = """  prepare-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
"""
          secret_expr = '$' + '{{ secrets.RELEASE_TOKEN || secrets.SCOOP_BUCKET_TOKEN || secrets.GH_PAT || secrets.PAT }}'
          job_new = """  prepare-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    env:
      GH_TOKEN: """ + secret_expr + "\n"
          if job_old not in text:
              raise SystemExit('job block not found')
          text = text.replace(job_old, job_new, 1)

          token_override = "        env:\n          GH_TOKEN: " + '$' + "{{ github.token }}\n"
          count = text.count(token_override)
          if count != 5:
              raise SystemExit(f'expected 5 github.token overrides, found {count}')
          text = text.replace(token_override, '')

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/apply-release-token-fix.yml').unlink()
      - name: Commit patched workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml .github/workflows/apply-release-token-fix.yml
          git commit -m "fix: use trusted token for release PR automation"
          git push origin HEAD:marc/fix-release-automation-token
