name: Temporary node-hid lockfile update

on:
  push:
    branches:
      - feat/pulsar-crazylight-probe

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/pulsar-crazylight-probe

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install node-hid and update lockfile
        run: npm install node-hid@3.4.0 --save-exact

      - name: Commit generated dependency files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "build: add node-hid transport dependency"
            git push origin HEAD:feat/pulsar-crazylight-probe
          }
