name: Run v1.3.4 launcher and icon patch

on:
  push:
    branches:
      - v1.3.4-game-library-ui
    paths:
      - .github/workflows/run-v134-launcher-icon-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1.3.4-game-library-ui

      - name: Execute embedded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          text = Path('.github/workflows/fix-v134-launchers-icons.yml').read_text(encoding='utf-8')
          start_marker = "      - name: Patch discovery and icon extraction\n        shell: python\n        run: |\n"
          end_marker = "\n      - name: Validate\n"
          if start_marker not in text or end_marker not in text:
              raise SystemExit('Could not locate embedded patch block')
          block = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(block)
          exec(compile(script, '<embedded-patch>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate
        shell: bash
        run: |
          node --check src/main.js
          node --check src/lib/gameLibraries.js
          node --test test/gameLibraries.test.js

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/lib/gameLibraries.js test/gameLibraries.test.js
          git commit -m "Improve game executable selection and icons"
          git push origin HEAD:v1.3.4-game-library-ui
