name: Publish v1.3.2 Once

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: publish-v1.3.2-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish only when absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.3.2 is already published; nothing to do.'
            exit 0
          fi

          gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-release.yml --event workflow_dispatch --limit 20 --json databaseId --jq '.[].databaseId' > existing-runs.txt
          gh workflow run publish-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.3.2 -f commit=5f37b114ec8d8e983a082e87bf4913820eee71f2

          run_id=''
          for attempt in $(seq 1 36); do
            while IFS= read -r candidate; do
              if ! grep -qx "$candidate" existing-runs.txt; then
                run_id="$candidate"
                break
              fi
            done < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-release.yml --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[].databaseId')

            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo 'Timed out waiting for the v1.3.2 publisher run to appear.' >&2
            exit 1
          fi

          echo "Watching publisher run $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

          tag=$(gh release view v1.3.2 --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          draft=$(gh release view v1.3.2 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$tag" != 'v1.3.2' ] || [ "$draft" != 'false' ]; then
            echo "Unexpected release state: tag=$tag draft=$draft" >&2
            exit 1
          fi

          gh release view v1.3.2 --repo "$GITHUB_REPOSITORY" --json url --jq .url
