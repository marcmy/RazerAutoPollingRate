name: Diagnose v1.3.2 Transform

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'marc/v1.3.2-usb-regression'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: marc/v1.3.2-usb-regression
          show-progress: false

      - name: Run exact source transforms
        shell: pwsh
        run: .github/apply-v132.ps1

      - name: Remove obsolete policy and scaffolding
        shell: pwsh
        run: |
          git rm src/lib/usbAccessPolicy.js test/usbAccessPolicy.test.js
          git rm '.github/v132-*.patch' .github/apply-v132.ps1

      - name: Restore normal CI workflow
        run: git checkout origin/main -- .github/workflows/ci.yml

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Show final status
        run: git status --short
