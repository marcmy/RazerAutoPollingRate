name: Publish v1.3.2 Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'marc/v1.3.2-usb-regression'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: marc/v1.3.2-usb-regression
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Transform and test source
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          if (-not (Test-Path '.github/apply-v132.ps1')) {
            Write-Host 'v1.3.2 source is already published; nothing to do.'
            return
          }

          & .github/apply-v132.ps1
          git rm src/lib/usbAccessPolicy.js test/usbAccessPolicy.test.js
          git rm '.github/v132-*.patch' .github/apply-v132.ps1 .github/workflows/debug-v132.yml

          npm ci
          npm test

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: restore continuous polling enforcement'
          git push origin HEAD:marc/v1.3.2-usb-regression
