name: Draft Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.2.9-maintained

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run make
      - name: Generate SHA256 hashes
        shell: pwsh
        run: |
          Get-ChildItem -Path out/make -Recurse -File |
            Where-Object { $_.Name -notlike '*.blockmap' } |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              "$($hash.Hash.ToLower())  $($_.Name)"
            } | Set-Content -Encoding ASCII SHA256SUMS.txt
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $notes = @"
          Maintained fork release.

          Highlights:
          - Adds a combined Settings window for persistent options and polling rules.
          - Moves settings and rules into config.ini, with migration from processlist.cfg.
          - Adds a runtime Enabled/Disabled tray toggle and Pick Window flow with F3.
          - Adds a default game polling rate for newly picked apps.
          - Improves autostart enablement by also updating Windows Startup Apps approved state.
          - Adds foreground-window detection while keeping running-process detection available.
          - Supports full executable path rules in the tray Settings window.
          - Improves elevated/protected foreground-process handling so bare process-name rules can still match when Windows hides the executable path.
          - Note: elevated/protected games may need bare .exe rules because full paths can be hidden from unelevated apps.
          - Preserves per-process polling-rate behavior from the nchaudhury fork.
          - Builds Windows x64 artifacts and SHA256 hashes from this workflow run.
          - Hardware limitation: automated tests use mocked logic; real dongle behavior still needs manual hardware verification.
          "@
          gh release create $env:RELEASE_TAG --draft --title $env:RELEASE_TAG --notes $notes
          Get-ChildItem -Path out/make -Recurse -File | ForEach-Object {
            gh release upload $env:RELEASE_TAG $_.FullName --clobber
          }
          gh release upload $env:RELEASE_TAG SHA256SUMS.txt --clobber
