name: Draft Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.2.13-maintained

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run make
      - name: Generate SHA256 hashes
        shell: pwsh
        run: |
          Get-ChildItem -Path out/make -Recurse -File |
            Where-Object { $_.Name -notlike '*.blockmap' } |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              "$($hash.Hash.ToLower())  $($_.Name)"
            } | Set-Content -Encoding ASCII SHA256SUMS.txt
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $notes = @"
          Maintained fork release.

          Highlights:
          - Adds optional diagnostic logging in Settings, disabled by default.
          - Adds an indented verbose diagnostic logging option for lower-level process-scan and polling-loop events.
          - Starts diagnostic logs only while a configured executable is running, using running-process detection even when foreground-window mode is active.
          - Logs detection selections, polling status, polling-rate change requests/results, and errors with timestamps.
          - Stores logs under %APPDATA%\RazerAutoPollingRate\diagnostic-logs using MM-DD-YYYY-Program.txt filenames and keeps the latest 10 log files.
          - Changes Autostart to a checkbox and shortens Settings dropdown widths for polling rates and detection mode.
          - Builds Windows x64 artifacts and SHA256 hashes from this workflow run.
          - Hardware limitation: no new real dongle smoke test was performed for this diagnostic logging release.
          "@
          gh release create $env:RELEASE_TAG --draft --title $env:RELEASE_TAG --notes $notes
          Get-ChildItem -Path out/make -Recurse -File | ForEach-Object {
            gh release upload $env:RELEASE_TAG $_.FullName --clobber
          }
          gh release upload $env:RELEASE_TAG SHA256SUMS.txt --clobber
