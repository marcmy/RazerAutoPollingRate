name: Release Windows

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  prepare-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Select next version
        shell: pwsh
        env:
          VERSION_BUMP: ${{ inputs.bump }}
        run: |
          $currentVersion = node -p "require('./package.json').version"

          npm version $env:VERSION_BUMP --no-git-tag-version
          if ($LASTEXITCODE -ne 0) {
            throw "npm version failed"
          }

          $releaseVersion = node -p "require('./package.json').version"
          $releaseTag = "v$releaseVersion"
          $releaseBranch = "release/$releaseTag"

          git ls-remote --exit-code --tags origin "refs/tags/$releaseTag" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $releaseTag already exists"
          }

          "CURRENT_VERSION=$currentVersion" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$releaseVersion" >> $env:GITHUB_ENV
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "RELEASE_BRANCH=$releaseBranch" >> $env:GITHUB_ENV

          Write-Host "Preparing $releaseTag from $currentVersion"

      - name: Commit and push release branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c $env:RELEASE_BRANCH
          git add package.json package-lock.json
          git commit -m "chore: release $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to commit release version"
          }

          git push origin "HEAD:$env:RELEASE_BRANCH"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to push release branch $env:RELEASE_BRANCH"
          }

          $headSha = git rev-parse HEAD
          "RELEASE_HEAD_SHA=$headSha" >> $env:GITHUB_ENV

      - name: Open release pull request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = @"
          Automated version bump from $env:CURRENT_VERSION to $env:RELEASE_VERSION.

          After the required CI checks pass, this workflow will merge the pull request and dispatch the Windows publishing workflow.
          "@

          $prUrl = gh pr create `
            --repo $env:GITHUB_REPOSITORY `
            --base main `
            --head $env:RELEASE_BRANCH `
            --title "chore: release $env:RELEASE_TAG" `
            --body $body
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create release pull request"
          }

          $prNumber = gh pr view $env:RELEASE_BRANCH `
            --repo $env:GITHUB_REPOSITORY `
            --json number `
            --jq .number
          if ($LASTEXITCODE -ne 0 -or -not $prNumber) {
            throw "Unable to determine release pull request number"
          }

          "RELEASE_PR_NUMBER=$prNumber" >> $env:GITHUB_ENV
          "RELEASE_PR_URL=$prUrl" >> $env:GITHUB_ENV

      - name: Dispatch required CI checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml `
            --repo $env:GITHUB_REPOSITORY `
            --ref $env:RELEASE_BRANCH
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to dispatch CI for $env:RELEASE_BRANCH"
          }

      - name: Wait for required CI checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = $null

          for ($attempt = 1; $attempt -le 36; $attempt++) {
            $runsJson = gh run list `
              --repo $env:GITHUB_REPOSITORY `
              --workflow ci.yml `
              --branch $env:RELEASE_BRANCH `
              --event workflow_dispatch `
              --limit 10 `
              --json databaseId,headSha,createdAt

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to query CI runs"
            }

            $run = $runsJson |
              ConvertFrom-Json |
              Where-Object { $_.headSha -eq $env:RELEASE_HEAD_SHA } |
              Sort-Object createdAt -Descending |
              Select-Object -First 1

            if ($run) {
              $runId = $run.databaseId
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $runId) {
            throw "Timed out waiting for the CI run to appear"
          }

          gh run watch $runId --repo $env:GITHUB_REPOSITORY --exit-status
          if ($LASTEXITCODE -ne 0) {
            throw "Required CI checks failed"
          }

      - name: Merge release pull request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Start-Sleep -Seconds 5

          gh pr merge $env:RELEASE_PR_NUMBER `
            --repo $env:GITHUB_REPOSITORY `
            --squash `
            --delete-branch `
            --subject "chore: release $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to merge release pull request"
          }

          git fetch origin main
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch merged main branch"
          }

          $releaseCommit = git rev-parse origin/main
          $mergedPackage = git show "origin/main:package.json" | Out-String | ConvertFrom-Json

          if ($mergedPackage.version -ne $env:RELEASE_VERSION) {
            throw "Merged main contains version $($mergedPackage.version), expected $env:RELEASE_VERSION"
          }

          "RELEASE_COMMIT=$releaseCommit" >> $env:GITHUB_ENV

      - name: Dispatch Windows publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-release.yml `
            --repo $env:GITHUB_REPOSITORY `
            --ref main `
            -f tag=$env:RELEASE_TAG `
            -f commit=$env:RELEASE_COMMIT
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to dispatch the publishing workflow"
          }

          "## Release prepared: [$env:RELEASE_TAG]($env:RELEASE_PR_URL)" >> $env:GITHUB_STEP_SUMMARY
          "The version-bump pull request passed CI, merged into main, and the Windows publishing workflow was dispatched." >> $env:GITHUB_STEP_SUMMARY
