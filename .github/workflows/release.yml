name: Release Windows

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  prepare-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    outputs:
      release_tag: ${{ steps.export-release.outputs.release_tag }}
      release_version: ${{ steps.export-release.outputs.release_version }}
      release_commit: ${{ steps.export-release.outputs.release_commit }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure release automation credentials
        shell: pwsh
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.SCOOP_BUCKET_TOKEN || secrets.GH_PAT || secrets.PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_AUTOMATION_TOKEN)) {
            throw 'No release automation token configured. Add RELEASE_TOKEN, SCOOP_BUCKET_TOKEN, GH_PAT, or PAT.'
          }

          "GH_TOKEN=$env:RELEASE_AUTOMATION_TOKEN" >> $env:GITHUB_ENV

      - name: Select or resume release
        shell: pwsh
        env:
          VERSION_BUMP: ${{ inputs.bump }}
        run: |
          $currentVersion = node -p "require('./package.json').version"

          npm version $env:VERSION_BUMP --no-git-tag-version
          if ($LASTEXITCODE -ne 0) {
            throw "npm version failed"
          }

          $releaseVersion = node -p "require('./package.json').version"
          $releaseTag = "v$releaseVersion"
          $releaseBranch = "release/$releaseTag"

          git ls-remote --exit-code --tags origin "refs/tags/$releaseTag" *> $null
          $tagProbeExitCode = $LASTEXITCODE
          if ($tagProbeExitCode -eq 0) {
            throw "Tag $releaseTag already exists"
          }
          if ($tagProbeExitCode -ne 2) {
            throw "Unable to check whether tag $releaseTag exists (git exit code $tagProbeExitCode)"
          }

          git fetch origin main
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch origin/main"
          }

          $remoteMainPackage = git show "origin/main:package.json" | Out-String | ConvertFrom-Json
          $remoteMainVersion = $remoteMainPackage.version
          $remoteMainCommit = git rev-parse origin/main
          $alreadyMerged = $remoteMainVersion -eq $releaseVersion

          if (-not $alreadyMerged -and $remoteMainVersion -ne $currentVersion) {
            throw "main changed from version $currentVersion to unexpected version $remoteMainVersion"
          }

          $branchOutput = git ls-remote --heads origin "refs/heads/$releaseBranch"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to check whether branch $releaseBranch exists"
          }

          $branchExists = -not [string]::IsNullOrWhiteSpace($branchOutput)
          if ($branchExists) {
            $releaseHeadSha = ($branchOutput -split '\s+')[0]
            "RELEASE_HEAD_SHA=$releaseHeadSha" >> $env:GITHUB_ENV
          }

          "CURRENT_VERSION=$currentVersion" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$releaseVersion" >> $env:GITHUB_ENV
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "RELEASE_BRANCH=$releaseBranch" >> $env:GITHUB_ENV
          "RELEASE_BRANCH_EXISTS=$($branchExists.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          "RELEASE_ALREADY_MERGED=$($alreadyMerged.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          "RELEASE_BASE_COMMIT=$remoteMainCommit" >> $env:GITHUB_ENV

          if ($alreadyMerged) {
            "RELEASE_COMMIT=$remoteMainCommit" >> $env:GITHUB_ENV
            Write-Host "$releaseTag is already merged at $remoteMainCommit; resuming publication"
          }
          elseif ($branchExists) {
            Write-Host "Reusing existing branch $releaseBranch at $releaseHeadSha"
          }
          else {
            Write-Host "Preparing new branch $releaseBranch from $currentVersion"
          }

          exit 0

      - name: Generate release notes and update changelog
        if: env.RELEASE_ALREADY_MERGED != 'true' && env.RELEASE_BRANCH_EXISTS != 'true'
        shell: pwsh
        run: |
          $changelog = Get-Content -LiteralPath 'CHANGELOG.md' -Raw
          $pattern = '(?ms)^## Unreleased[ \t]*\r?\n(.*?)(?=^##\s+v|\z)'
          $match = [regex]::Match($changelog, $pattern)

          if (-not $match.Success) {
            throw "CHANGELOG.md does not contain an '## Unreleased' section"
          }

          $manualNotes = $match.Groups[1].Value.Trim()

          if ($manualNotes) {
            $releaseNotes = $manualNotes
            Write-Host "Using hand-written notes from the Unreleased section"
          }
          else {
            $previousTag = git describe --tags --abbrev=0 --match 'v[0-9]*' 2>$null
            if ($LASTEXITCODE -ne 0) {
              $previousTag = $null
            }

            $arguments = @(
              'api',
              '--method', 'POST',
              "repos/$env:GITHUB_REPOSITORY/releases/generate-notes",
              '-f', "tag_name=$env:RELEASE_TAG",
              '-f', "target_commitish=$env:RELEASE_BASE_COMMIT",
              '--jq', '.body'
            )

            if ($previousTag) {
              $arguments += @('-f', "previous_tag_name=$previousTag")
            }

            $generated = & gh @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to generate release notes"
            }

            $releaseNotes = ($generated -join "`n").Trim()
            $releaseNotes = [regex]::Replace($releaseNotes, '(?m)^## ', '### ')
            $releaseNotes = [regex]::Replace(
              $releaseNotes,
              '(?m)^\*\*Full Changelog\*\*:.*(?:\r?\n)?',
              ''
            ).Trim()

            if (-not $releaseNotes) {
              $releaseNotes = '- Maintenance release.'
            }

            Write-Host "Generated release notes from changes since $previousTag"
          }

          $replacement = @(
            '## Unreleased',
            '',
            "## $env:RELEASE_TAG",
            '',
            $releaseNotes,
            '',
            ''
          ) -join "`r`n"

          $updated = $changelog.Substring(0, $match.Index) +
            $replacement +
            $changelog.Substring($match.Index + $match.Length)

          [IO.File]::WriteAllText(
            (Resolve-Path 'CHANGELOG.md').Path,
            $updated,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Validate existing release branch
        if: env.RELEASE_ALREADY_MERGED != 'true' && env.RELEASE_BRANCH_EXISTS == 'true'
        shell: pwsh
        run: |
          git fetch origin "refs/heads/$env:RELEASE_BRANCH"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch existing release branch"
          }

          $branchPackage = git show "FETCH_HEAD:package.json" | Out-String | ConvertFrom-Json
          $branchHeadSha = git rev-parse FETCH_HEAD
          $branchChangelog = git show "FETCH_HEAD:CHANGELOG.md" | Out-String

          if ($branchPackage.version -ne $env:RELEASE_VERSION) {
            throw "Existing branch contains version $($branchPackage.version), expected $env:RELEASE_VERSION"
          }

          if ($branchChangelog -notmatch "(?m)^## $([regex]::Escape($env:RELEASE_TAG))\s*$") {
            throw "Existing release branch does not contain a CHANGELOG.md section for $env:RELEASE_TAG"
          }

          if ($branchHeadSha -ne $env:RELEASE_HEAD_SHA) {
            throw "Release branch moved while preparing the rerun"
          }

      - name: Commit and push release branch
        if: env.RELEASE_ALREADY_MERGED != 'true' && env.RELEASE_BRANCH_EXISTS != 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c $env:RELEASE_BRANCH
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to commit release version and notes"
          }

          git push origin "HEAD:$env:RELEASE_BRANCH"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to push release branch $env:RELEASE_BRANCH"
          }

          $headSha = git rev-parse HEAD
          "RELEASE_HEAD_SHA=$headSha" >> $env:GITHUB_ENV

      - name: Open or reuse release pull request
        if: env.RELEASE_ALREADY_MERGED != 'true'
        shell: pwsh
        run: |
          $prJson = gh pr list `
            --repo $env:GITHUB_REPOSITORY `
            --base main `
            --head $env:RELEASE_BRANCH `
            --state open `
            --limit 1 `
            --json number,url
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to query existing release pull requests"
          }

          $pr = $prJson | ConvertFrom-Json | Select-Object -First 1

          if (-not $pr) {
            $body = @(
              "Automated version bump from $env:CURRENT_VERSION to $env:RELEASE_VERSION.",
              '',
              'The workflow also promotes the Unreleased changelog section when present, or generates release notes automatically from changes since the previous tag.',
              '',
              'After the required CI checks pass, this workflow merges the pull request and publishes the Windows release from the exact merged commit.'
            ) -join [Environment]::NewLine

            $prUrl = gh pr create `
              --repo $env:GITHUB_REPOSITORY `
              --base main `
              --head $env:RELEASE_BRANCH `
              --title "chore: release $env:RELEASE_TAG" `
              --body $body
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create release pull request"
            }

            $prNumber = gh pr view $env:RELEASE_BRANCH `
              --repo $env:GITHUB_REPOSITORY `
              --json number `
              --jq .number
          }
          else {
            $prNumber = $pr.number
            $prUrl = $pr.url
            Write-Host "Reusing release pull request #$prNumber"
          }

          if (-not $prNumber) {
            throw "Unable to determine release pull request number"
          }

          "RELEASE_PR_NUMBER=$prNumber" >> $env:GITHUB_ENV
          "RELEASE_PR_URL=$prUrl" >> $env:GITHUB_ENV

      - name: Dispatch required CI checks
        if: env.RELEASE_ALREADY_MERGED != 'true'
        shell: pwsh
        run: |
          gh workflow run ci.yml `
            --repo $env:GITHUB_REPOSITORY `
            --ref $env:RELEASE_BRANCH
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to dispatch CI for $env:RELEASE_BRANCH"
          }

      - name: Wait for required CI checks
        if: env.RELEASE_ALREADY_MERGED != 'true'
        shell: pwsh
        run: |
          $runId = $null

          for ($attempt = 1; $attempt -le 36; $attempt++) {
            $runsJson = gh run list `
              --repo $env:GITHUB_REPOSITORY `
              --workflow ci.yml `
              --branch $env:RELEASE_BRANCH `
              --event workflow_dispatch `
              --limit 10 `
              --json databaseId,headSha,createdAt

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to query CI runs"
            }

            $run = $runsJson |
              ConvertFrom-Json |
              Where-Object { $_.headSha -eq $env:RELEASE_HEAD_SHA } |
              Sort-Object createdAt -Descending |
              Select-Object -First 1

            if ($run) {
              $runId = $run.databaseId
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $runId) {
            throw "Timed out waiting for the CI run to appear"
          }

          gh run watch $runId --repo $env:GITHUB_REPOSITORY --exit-status
          if ($LASTEXITCODE -ne 0) {
            throw "Required CI checks failed"
          }

          gh pr checks $env:RELEASE_PR_NUMBER `
            --repo $env:GITHUB_REPOSITORY `
            --required `
            --watch `
            --fail-fast
          if ($LASTEXITCODE -ne 0) {
            throw "Repository-required checks did not pass"
          }

      - name: Merge release pull request
        if: env.RELEASE_ALREADY_MERGED != 'true'
        shell: pwsh
        run: |
          gh pr merge $env:RELEASE_PR_NUMBER `
            --repo $env:GITHUB_REPOSITORY `
            --squash `
            --delete-branch `
            --subject "chore: release $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to merge release pull request"
          }

          git fetch origin main
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch merged main branch"
          }

          $releaseCommit = git rev-parse origin/main
          $mergedPackage = git show "origin/main:package.json" | Out-String | ConvertFrom-Json
          $mergedChangelog = git show "origin/main:CHANGELOG.md" | Out-String

          if ($mergedPackage.version -ne $env:RELEASE_VERSION) {
            throw "Merged main contains version $($mergedPackage.version), expected $env:RELEASE_VERSION"
          }

          if ($mergedChangelog -notmatch "(?m)^## $([regex]::Escape($env:RELEASE_TAG))\s*$") {
            throw "Merged main does not contain release notes for $env:RELEASE_TAG"
          }

          "RELEASE_COMMIT=$releaseCommit" >> $env:GITHUB_ENV

      - name: Validate resumed release metadata
        if: env.RELEASE_ALREADY_MERGED == 'true'
        shell: pwsh
        run: |
          $mergedChangelog = git show "$($env:RELEASE_COMMIT):CHANGELOG.md" | Out-String
          if ($mergedChangelog -notmatch "(?m)^## $([regex]::Escape($env:RELEASE_TAG))\s*$") {
            throw "Merged release commit does not contain release notes for $env:RELEASE_TAG"
          }

      - name: Export release state
        id: export-release
        shell: pwsh
        run: |
          "release_tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "release_version=$env:RELEASE_VERSION" >> $env:GITHUB_OUTPUT
          "release_commit=$env:RELEASE_COMMIT" >> $env:GITHUB_OUTPUT

          if ($env:RELEASE_PR_URL) {
            "## Release prepared: [$env:RELEASE_TAG]($env:RELEASE_PR_URL)" >> $env:GITHUB_STEP_SUMMARY
          }
          else {
            "## Release resumed: $env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY
          }

          "Version bump, release notes, CI validation, merge, packaging, and publication are handled by this one workflow." >> $env:GITHUB_STEP_SUMMARY

  publish:
    needs: prepare-release
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
      RELEASE_COMMIT: ${{ needs.prepare-release.outputs.release_commit }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_commit }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Validate release metadata
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag format"
          }
          if ($env:RELEASE_COMMIT -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid release commit format"
          }

          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          $actualCommit = git rev-parse HEAD
          $expectedCommit = $env:RELEASE_COMMIT.ToLowerInvariant()

          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag $env:RELEASE_TAG does not match package version $version"
          }

          if ($actualCommit -ne $expectedCommit) {
            throw "Checked out commit $actualCommit, expected $expectedCommit"
          }

          git fetch origin main
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch origin/main"
          }

          git merge-base --is-ancestor $actualCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release commit $actualCommit is not reachable from main"
          }

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run make

      - name: Generate SHA256 hashes
        shell: pwsh
        run: |
          $root = (Resolve-Path 'out/make').Path

          Get-ChildItem -Path $root -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              $relativePath = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
              "$($hash.Hash.ToLower())  $relativePath"
            } | Set-Content -Encoding ASCII SHA256SUMS.txt

      - name: Generate release notes from changelog
        shell: pwsh
        run: |
          $lines = @(Get-Content -LiteralPath 'CHANGELOG.md')
          $heading = "## $env:RELEASE_TAG"
          $start = [Array]::IndexOf($lines, $heading)

          if ($start -lt 0) {
            throw "CHANGELOG.md does not contain an exact '$heading' section"
          }

          $end = $lines.Count
          for ($index = $start + 1; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match '^##\s+') {
              $end = $index
              break
            }
          }

          $section = if ($end -gt ($start + 1)) {
            @($lines[($start + 1)..($end - 1)])
          }
          else {
            @()
          }

          while ($section.Count -gt 0 -and [string]::IsNullOrWhiteSpace($section[0])) {
            $section = @($section | Select-Object -Skip 1)
          }
          while ($section.Count -gt 0 -and [string]::IsNullOrWhiteSpace($section[-1])) {
            $section = @($section | Select-Object -SkipLast 1)
          }

          if ($section.Count -eq 0) {
            throw "The $heading changelog section is empty"
          }

          $changelogUrl = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:RELEASE_COMMIT/CHANGELOG.md"
          $notes = @($section) + @('', '---', '', "[Complete changelog]($changelogUrl)")
          [IO.File]::WriteAllLines('RELEASE_NOTES.md', $notes, [Text.UTF8Encoding]::new($false))

      - name: Create or update draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName *> $null

          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:RELEASE_COMMIT `
              --title "Razer Auto Polling Rate $env:RELEASE_VERSION" `
              --notes-file RELEASE_NOTES.md `
              --draft
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create draft release"
            }
          }
          else {
            gh release edit $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --title "Razer Auto Polling Rate $env:RELEASE_VERSION" `
              --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to update draft release notes"
            }
          }

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -Path 'out/make' -Recurse -File |
              Sort-Object FullName |
              ForEach-Object { $_.FullName }
          )
          $assets += (Resolve-Path 'SHA256SUMS.txt').Path

          $arguments = @(
            'release',
            'upload',
            $env:RELEASE_TAG,
            '--repo',
            $env:GITHUB_REPOSITORY,
            '--clobber'
          ) + $assets

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to upload release assets"
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --draft=false `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to publish release"
          }

          $releaseUrl = gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json url `
            --jq .url

          "RELEASE_URL=$releaseUrl" >> $env:GITHUB_ENV

      - name: Trigger Scoop bucket update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scoop-excavator.yml `
            --repo $env:GITHUB_REPOSITORY `
            --ref main
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to dispatch the Scoop excavator trigger"
          }

          "## Released [$env:RELEASE_TAG]($env:RELEASE_URL)" >> $env:GITHUB_STEP_SUMMARY
          "Windows artifacts and SHA256SUMS.txt were uploaded, and the Scoop trigger workflow was dispatched." >> $env:GITHUB_STEP_SUMMARY
