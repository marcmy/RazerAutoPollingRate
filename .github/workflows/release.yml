name: Release Windows

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Select next version
        shell: pwsh
        run: |
          $currentVersion = node -p "require('./package.json').version"

          npm version "${{ inputs.bump }}" --no-git-tag-version
          if ($LASTEXITCODE -ne 0) {
            throw "npm version failed"
          }

          $releaseVersion = node -p "require('./package.json').version"
          $releaseTag = "v$releaseVersion"

          git ls-remote --exit-code --tags origin "refs/tags/$releaseTag" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $releaseTag already exists"
          }

          "CURRENT_VERSION=$currentVersion" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$releaseVersion" >> $env:GITHUB_ENV
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV

          Write-Host "Preparing $releaseTag from $currentVersion"
          exit 0

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run make

      - name: Validate generated changes
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --check failed"
          }

      - name: Generate SHA256 hashes
        shell: pwsh
        run: |
          $root = (Resolve-Path 'out/make').Path

          Get-ChildItem -Path $root -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              $relativePath = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
              "$($hash.Hash.ToLower())  $relativePath"
            } | Set-Content -Encoding ASCII SHA256SUMS.txt

      - name: Commit release version
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json
          git commit -m "chore: release $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to commit release version"
          }

          git fetch origin main
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch origin/main"
          }

          $remotePackage = git show origin/main:package.json | Out-String | ConvertFrom-Json
          $remoteVersion = $remotePackage.version

          if ($remoteVersion -eq $env:RELEASE_VERSION) {
            Write-Host "Version $env:RELEASE_VERSION was already committed by an earlier attempt"
            $releaseCommit = git rev-parse origin/main
          }
          elseif ($remoteVersion -eq $env:CURRENT_VERSION) {
            git rebase origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to rebase the release commit onto origin/main"
            }

            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to push the release commit"
            }

            $releaseCommit = git rev-parse HEAD
          }
          else {
            throw "main changed from version $env:CURRENT_VERSION to unexpected version $remoteVersion"
          }

          "RELEASE_COMMIT=$releaseCommit" >> $env:GITHUB_ENV

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -Path 'out/make' -Recurse -File |
              Sort-Object FullName |
              ForEach-Object { $_.FullName }
          )
          $assets += (Resolve-Path 'SHA256SUMS.txt').Path

          $arguments = @(
            'release',
            'create',
            $env:RELEASE_TAG,
            '--repo',
            $env:GITHUB_REPOSITORY,
            '--target',
            $env:RELEASE_COMMIT,
            '--title',
            "Razer Auto Polling Rate $env:RELEASE_VERSION",
            '--generate-notes'
          ) + $assets

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create GitHub release"
          }

          $releaseUrl = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json url --jq .url
          "## Released [$env:RELEASE_TAG]($releaseUrl)" >> $env:GITHUB_STEP_SUMMARY
          "Windows artifacts and SHA256SUMS.txt were uploaded automatically." >> $env:GITHUB_STEP_SUMMARY
